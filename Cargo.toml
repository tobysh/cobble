[workspace]
resolver = "2"
members = ["src-tauri", "crates/cobble-core", "crates/cobble-storage"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[profile.dev]
# Keep incremental builds fast; the plugin-host crate (wasmtime) benefits most from this.
incremental = true

[profile.release]
lto = true
codegen-units = 1
