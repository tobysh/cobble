name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-css:
    name: Stylelint (theme token enforcement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run stylelint
        run: pnpm --dir frontend lint:css
